<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAA designated countries</title>
<style>
  /* Embeddable map of Trade Agreements Act designated countries (FAR 25.003).
     Light by default; add ?theme=dark to the iframe src to match a dark blog. */
  :root{
    --taa:rgb(37, 59, 119);
    --land:#DDE0E7;
    --us:#C2C8DA;
    --paper:#ffffff;
    --ink:#171A21;
    --ink-2:#5C6373;
    --rule:#D5D9E2;
  }
  html[data-theme="dark"]{ --ink:#EDEFF4; --ink-2:#A2AAB9; --rule:#39404F; }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0; background:transparent; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .legend{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 12px}
  .legend button{
    font:inherit; font-size:13px; color:var(--ink); background:transparent;
    border:1px solid var(--rule); border-radius:999px; padding:4px 12px 4px 9px;
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    transition:border-color .12s ease, background-color .12s ease;
  }
  .legend button:hover{border-color:var(--ink-2)}
  .legend button:focus-visible{outline:2px solid var(--taa); outline-offset:2px}
  .legend button[aria-pressed="true"]{border-color:var(--taa); background:color-mix(in srgb, var(--taa) 12%, transparent)}
  .legend .sw{width:10px; height:10px; border-radius:2px; background:var(--taa); flex:none}
  .legend .sw.all{background:linear-gradient(135deg,var(--taa) 50%, var(--land) 50%)}
  .legend .n{color:var(--ink-2); font-variant-numeric:tabular-nums}

  .board{position:relative; background:var(--paper); border-radius:5px; overflow:hidden; border:1px solid var(--rule)}
  svg.map{display:block; width:100%; height:auto}
  .map .other{fill:var(--land)}
  .map .us{fill:var(--us)}
  .map .taa{fill:var(--taa)}
  .map path,.map circle{stroke:#fff; stroke-width:.4; vector-effect:non-scaling-stroke}
  .map circle{stroke-width:.7}
  .map .grat{fill:none; stroke:#EDEFF3; stroke-width:.6}
  .map path[data-n]:hover,.map circle:hover{stroke-width:1.1}
  .map[data-filter] .taa:not(.on){fill:var(--land)}

  .tip{
    position:absolute; pointer-events:none; opacity:0;
    background:var(--taa); color:#fff; padding:6px 10px; border-radius:4px;
    font-size:13px; line-height:1.35; max-width:240px; white-space:nowrap;
    transition:opacity .09s linear;
  }
  .tip b{font-weight:600; display:block}
  .tip span{opacity:.78; font-size:12px; white-space:normal}
  .tip.show{opacity:1}
  .cap{margin:10px 0 0; font-size:12.5px; color:var(--ink-2)}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>

  <p class="cap">Designated countries under FAR 25.003. Dots mark states and territories too small to see at this scale. The United States is shaded pale blue: US-made goods qualify as domestic offers, not designated-country offers.</p>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  if (params.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';

  var map = document.querySelector('svg.map');
  var tip = document.getElementById('tip');
  var board = document.querySelector('.board');

  document.querySelectorAll('.legend button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.legend button').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
      btn.setAttribute('aria-pressed','true');
      var k = btn.dataset.f;
      map.querySelectorAll('.taa').forEach(function(el){ el.classList.remove('on'); });
      if(!k){ map.removeAttribute('data-filter'); return; }
      map.setAttribute('data-filter', k);
      map.querySelectorAll('.c-' + k).forEach(function(el){ el.classList.add('on'); });
    });
  });

  map.addEventListener('pointermove', function(e){
    var t = e.target.closest('[data-n]');
    if(!t){ tip.classList.remove('show'); return; }
    var r = board.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    tip.innerHTML = '<b>' + t.dataset.n + '</b>' + (t.dataset.c ? '<span>' + t.dataset.c + '</span>' : '');
    tip.style.transform = y < 54 ? 'translate(-50%, 22px)' : 'translate(-50%, -116%)';
    tip.style.left = Math.max(70, Math.min(r.width - 70, x)) + 'px';
    tip.style.top = y + 'px';
    tip.classList.add('show');
  });
  map.addEventListener('pointerleave', function(){ tip.classList.remove('show'); });

  // tell the host page how tall we are, so the iframe can size itself
  function postHeight(){
    var h = document.body.scrollHeight;
    parent.postMessage({ taaMapHeight: h }, '*');
  }
  new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener('load', postHeight);
})();
</script>
